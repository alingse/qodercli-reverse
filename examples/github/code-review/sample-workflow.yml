name: Qoder Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: |
          cd decompiled && go build -o /usr/local/bin/qodercli-reverse .
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          qodercli-reverse review-pr --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }} --max-lines 5000