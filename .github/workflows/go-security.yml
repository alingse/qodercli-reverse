name: Go Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: decompiled/go.mod
          cache-dependency-path: decompiled/go.sum

      - name: Module verification
        working-directory: decompiled
        run: go mod verify

      - name: govulncheck
        working-directory: decompiled
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...