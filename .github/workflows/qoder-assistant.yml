name: Qoder Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assistant:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@qoder')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build qodercli-reverse
        working-directory: decompiled
        run: go build -o /usr/local/bin/qodercli-reverse .

      - name: Handle @qoder mention
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER="${{ github.event.issue.number }}"
          if [ -z "$NUMBER" ]; then NUMBER="${{ github.event.pull_request.number }}"; fi
          qodercli-reverse assistant \
            --repo ${{ github.repository }} \
            --issue "$NUMBER" \
            --comment "${{ github.event.comment.body }}" \
            --author "${{ github.event.comment.user.login }}" \
            --post
