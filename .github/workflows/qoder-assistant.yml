name: Qoder Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assistant:
    if: |
      contains(github.event.comment.body, '@qoder') &&
      !endsWith(github.event.comment.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: decompiled/go.mod
          cache-dependency-path: decompiled/go.sum

      - name: Build qodercli-reverse
        working-directory: decompiled
        run: go build -o /usr/local/bin/qodercli-reverse .

      - name: Handle @qoder mention
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          NUMBER="${ISSUE_NUMBER}"
          if [ -z "$NUMBER" ]; then NUMBER="${PR_NUMBER}"; fi
          if [ -z "$NUMBER" ]; then echo "::error::No issue/PR number"; exit 1; fi
          # Bot filtering
          case "$COMMENT_AUTHOR" in *"[bot]") echo "Bot comment, skipping"; exit 0 ;; esac
          qodercli-reverse assistant \
            --repo "$REPO" \
            --issue "$NUMBER" \
            --comment "$COMMENT_BODY" \
            --author "$COMMENT_AUTHOR" \
            --post